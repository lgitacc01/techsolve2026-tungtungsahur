services:
  backend:
    build:
      context: ./be
      dockerfile: Dockerfile
    # Expose dùng để Nginx có thể thấy backend nội bộ ở port 8000
    expose:
      - "8000"
    # Đường dẫn chính xác đến file .env dựa trên ảnh của bạn
    env_file:
      - ./be/.env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    restart: unless-stopped
    networks:
      - app_network

  proxy:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app_network

networks:
  app_network:
    driver: bridge